[project]
name = "pep_restaurant"
authors = [
    { name = "Pep Restaurant", email = "ransbor82@gmail.com" }
]
description = "Standalone restaurant POS for Frappe - tables, KOT, kitchen display, QR ordering, recipes and stock"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["B904", "E501", "E741", "F401", "W191", "E101", "UP031", "UP032", "RUF012"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
